[".local/bin/mo"]
    type = "file"
    url = "https://raw.githubusercontent.com/tests-always-included/mo/refs/heads/master/mo"
    refreshPeriod = "168h"
    executable = true

[".local/share/fzf-git"]
    type = "archive"
    url = "https://github.com/junegunn/fzf-git.sh/archive/refs/heads/main.zip"
    stripComponents = 1
    refreshPeriod = "168h"
    exact = true
    exclude = ["*/.github/**"]

[".local/share/zsh-you-should-use"]
    type = "archive"
    url = "https://github.com/MichaelAquilina/zsh-you-should-use/archive/refs/heads/master.zip"
    stripComponents = 1
    refreshPeriod = "168h"
    exact = true
    exclude = [
        "*/.circleci",
        "*/img/**",
        "*/tests/**"
    ]
